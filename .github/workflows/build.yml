name: Build LifeSteal
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: LifeSteal
          path: target/*.jar